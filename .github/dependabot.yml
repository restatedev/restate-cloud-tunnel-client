version: 2

# GitHub Actions are pinned in .github/workflows/actions.lock and updated with
# `gh actions-lock`; a Dependabot bump would leave the lockfile stale.
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "UTC"
    cooldown:
      semver-major-days: 7
      semver-minor-days: 3
      semver-patch-days: 3
    open-pull-requests-limit: 5
    ignore:
      # hickory-resolver 0.26 is a breaking (0.x "major") bump that reorganized the Name,
      # error and lookup APIs; it needs a scheduled code port (restatedev/restate-cloud#2503).
      # Remove once done.
      - dependency-name: "hickory-resolver"
        versions: [">= 0.26"]
    groups:
      # rustls, aws-lc and ring move as one cryptographic stack; a split bump
      # (notably an aws-lc-sys major) fails to build, more so against musl.
      rustls-aws-lc:
        patterns:
          - "rustls*"
          - "aws-lc*"
          - "ring"
          - "webpki*"
      # tonic re-exports a specific prost and the generated code must match it,
      # so they only interoperate at the versions they were built against.
      tonic-prost:
        patterns:
          - "tonic*"
          - "prost*"
      cargo-nonmajor:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # dev-tools carries the Rust toolchain and musl that the binary links
  # statically; the runtime base is pinned by digest.
  - package-ecosystem: "docker"
    directory: "/docker"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "UTC"
    cooldown:
      default-days: 3
    open-pull-requests-limit: 2
    groups:
      docker-base-images:
        patterns:
          - "*"
