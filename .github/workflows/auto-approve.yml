name: Auto-Approve PR

# Lets a team member self-approve a PR by adding the `auto-approve` label.
# Approvals are visible: the bot leaves the review on the PR and announces it
# in Slack, so changes merged this way can be reviewed after the fact.
on:
  pull_request:
    types: [labeled]

permissions:
  pull-requests: write
  contents: read
  issues: read

jobs:
  auto-approve:
    if: ${{ github.event.label.name == 'auto-approve' && github.event.sender.type == 'User' }}
    runs-on: ubuntu-latest

    steps:
      - name: Auto-approve PR
        id: auto_approve
        run: gh pr review "$PR" --repo "$GITHUB_REPOSITORY" --approve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}

      - name: Notify Slack of auto-approval
        if: ${{ success() && steps.auto_approve.conclusion == 'success' }}
        uses: rtCamp/action-slack-notify@639bbe0ee9b68d0140259ac541b898f3791916f9 # v2.4.0
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_USERNAME: github-bot
          SLACK_ICON_EMOJI: ":white_check_mark:"
          SLACK_TITLE: "PR Auto-Approved by Bot"
          SLACK_MESSAGE: ":robot_face: *Bot auto-approved* <${{ github.event.pull_request.html_url }}|PR #${{ github.event.pull_request.number}}: ${{ github.event.pull_request.title }}> in *${{ github.repository }}* (_label_: `${{ github.event.label.name }}`)."
