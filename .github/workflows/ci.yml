name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5.1.0
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - run: cargo fmt --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5.1.0
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - name: Install protoc
        uses: restatedev/restate/.github/actions/install-protoc@main
      - uses: Swatinem/rust-cache@v2.9.3
      - run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5.1.0
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - name: Install protoc
        uses: restatedev/restate/.github/actions/install-protoc@main
      - uses: Swatinem/rust-cache@v2.9.3
      - run: cargo test --all-targets

  build-image:
    name: Build release Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5.1.0
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1
      - name: Install just
        uses: extractions/setup-just@v4.0.0
      - name: Build the release image (no push)
        run: just docker
